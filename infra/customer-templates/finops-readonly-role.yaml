AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  FinOps Platform - least-privilege READ-ONLY role. Lets the FinOps platform read cost data,
  resource inventory and CloudWatch metrics. It cannot create, modify or delete anything,
  and cannot read data inside your resources (no S3 GetObject, no DB access, no secrets).

Parameters:
  TrustedAccountId:
    Type: String
    AllowedPattern: "^\\d{12}$"
    Description: AWS account ID where the FinOps platform runs (shown on the Connect page).
  ExternalId:
    Type: String
    MinLength: 16
    MaxLength: 128
    AllowedPattern: "^[\\w+=,.@:/-]+$"
    NoEcho: true
    Description: Unique ExternalId generated by the FinOps platform for this account.
  RoleName:
    Type: String
    Default: FinOpsReadOnly
    AllowedPattern: "^FinOps[\\w+=,.@-]{0,58}$"
    Description: Must start with FinOps - the platform may only assume roles named FinOps*.

Resources:
  FinOpsReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read-only access for the FinOps platform (cost, inventory, metrics).
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TrustFinOpsPlatformWithExternalId
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${TrustedAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: FinOpsReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CostExplorerRead
                Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - ce:GetDimensionValues
                  - ce:GetTags
                Resource: "*"
              - Sid: ComputeAndStorageDescribe
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeAddresses
                  - rds:DescribeDBInstances
                  - rds:ListTagsForResource
                  - lambda:ListFunctions
                  - lambda:ListTags
                Resource: "*"
              - Sid: S3BucketMetadataOnly
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetLifecycleConfiguration
                  - s3:GetBucketTagging
                  - s3:GetBucketVersioning
                Resource: "*"
              - Sid: MetricsRead
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                Resource: "*"
              - Sid: PricingRead
                Effect: Allow
                Action:
                  - pricing:GetProducts
                Resource: "*"

Outputs:
  RoleArn:
    Description: Paste this ARN into the FinOps platform's Connect account page.
    Value: !GetAtt FinOpsReadOnlyRole.Arn
