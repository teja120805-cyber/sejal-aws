name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend + collector (lint, tests, coverage)
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      MOTO_EC2_LOAD_DEFAULT_AMIS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Ruff lint + format check
        run: |
          ruff check backend collector
          ruff format --check backend collector
      - name: Backend tests (fails under 70% coverage)
        working-directory: backend
        run: pytest --cov --cov-report=xml --cov-report=term
      - name: Collector tests
        working-directory: collector
        run: pytest
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  infra:
    name: Infra (CDK tests + synth, never deploys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install
        working-directory: infra
        run: |
          pip install -r requirements-dev.txt
          npm ci
      - name: Lint
        run: |
          pip install ruff
          ruff check infra --exclude infra/build
      - name: Build Lambda package
        run: python infra/scripts/build_lambda.py
      - name: CDK assertion tests
        working-directory: infra
        run: pytest
      - name: CDK synth
        working-directory: infra
        run: npm run synth -- --quiet
