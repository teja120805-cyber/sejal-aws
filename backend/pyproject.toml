[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "finops"
version = "0.1.0"
description = "Cloud-native FinOps platform: AWS cost monitoring and optimisation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "mangum>=0.19,<1.0",
    "boto3>=1.35",
    "numpy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "uvicorn[standard]>=0.30",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "moto[all]>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finops"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Rule thresholds are declared ClassVar on the Rule base class
"src/finops/rules/definitions.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["finops"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
